name: Rust

on:
  # No `paths` filter here on purpose. A required status check that never
  # runs never reports, and the pull request waits on it forever — so every
  # PR runs this, including one that only touches docs. The `push` filter
  # below keeps that from costing anything on master.
  pull_request:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'shell/**'
      - '.github/workflows/rust.yml'

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable, with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          # Spelled out because the pin replaced the `@stable` ref that used
          # to carry this.
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --release

      - name: cargo test
        run: cargo test --release

      - name: Windows secure launcher acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows_launcher.ps1 -Binary ./target/release/claude-acc.exe

      - name: Windows native shim acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows_shim.ps1 -Binary ./target/release/claude-acc.exe

      - name: Windows path identity acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows_paths.ps1 -Binary ./target/release/claude-acc.exe

  # Build and publish the Windows candidate ONLY for a pull request, from the
  # EXACT PR head (not the synthetic refs/pull/N/merge commit), so the
  # artifact's provenance is unambiguous. This is additive: it does not alter
  # the `rust` matrix above (which keeps testing the merge commit as a required
  # check), keeps read-only permissions, uses no secrets, and is not
  # pull_request_target.
  candidate:
    name: windows candidate (exact PR head)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the exact PR head (not the merge commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - name: Build release candidate (clean, uncached)
        run: cargo build --release

      - name: Collect checksum and non-secret provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'target/release/claude-acc.exe'
          if (-not (Test-Path $bin)) { throw "candidate binary missing: $bin" }
          New-Item -ItemType Directory -Force candidate | Out-Null
          Copy-Item $bin candidate/claude-acc.exe
          $sha = (Get-FileHash candidate/claude-acc.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path candidate/claude-acc.exe.sha256 -Value "$sha  claude-acc.exe"
          $checkout = (git rev-parse HEAD)
          $tree = (git rev-parse 'HEAD^{tree}')
          $prov = [ordered]@{
            artifact             = 'claude-acc.exe'
            sha256               = $sha
            size_bytes           = (Get-Item candidate/claude-acc.exe).Length
            pr_head_commit       = '${{ github.event.pull_request.head.sha }}'
            checkout_commit      = $checkout
            tree                 = $tree
            pr_number            = '${{ github.event.pull_request.number }}'
            workflow_run_id      = '${{ github.run_id }}'
            workflow_run_attempt = '${{ github.run_attempt }}'
            target               = 'x86_64-pc-windows-msvc'
            runner_os            = '${{ runner.os }}'
            rustc_version        = (rustc --version)
          }
          $prov | ConvertTo-Json | Set-Content -Path candidate/provenance.json
          if ($checkout -ne '${{ github.event.pull_request.head.sha }}') {
            throw "checkout $checkout is not the PR head ${{ github.event.pull_request.head.sha }}"
          }
          Write-Host "candidate sha256=$sha size=$((Get-Item candidate/claude-acc.exe).Length) head=$checkout"

      - name: Upload the candidate (exe + checksum + provenance only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-acc-windows-candidate
          path: |
            candidate/claude-acc.exe
            candidate/claude-acc.exe.sha256
            candidate/provenance.json
          if-no-files-found: error
          retention-days: 7
